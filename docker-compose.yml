services:
  db:
    image: postgres:15-alpine
    container_name: stockmaster-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stockmaster
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockmaster-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://user:password@db:5432/stockmaster
      PORT: 3000
    depends_on:
      - db
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockmaster-frontend
    depends_on:
      - backend
    ports:
      - "3001:80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: stockmaster-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
